<!DOCTYPE html>
<html lang="en">
<head>
    <title>Kantin SMK PI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>kasir kantin sekolah SMK PI</h1>

            <label>nama pembeli</label>
            <input type="text" id="nama" placeholder="Masukkan nama">

            <label>pilih produk</label>
            <select id="produk">

        <option value="10.000"> Seblak - Rp100.000</option>
        <option value="5.000"> pop ice - Rp500.000</option>
        <option value="10.000"> cilok - Rp100.000</option>
        <option value="5.000"> batagor - Rp500.000</option>
    </select>

    <label>jumlah</label>
    <input type="number" id="jumlah" value="1" min="1">

    <button onclick="hitungTotal()">hitung total</button>
    <div class="hasil">
        <p>nama : <span id="hasilNama"></span></p>
        <p>total harga : <span id="total harga">0</span></p> 
        <p>diskon : <span id="diskon">0</span></p>
        <p>total bayar : <span id="totalbayar">10000</span></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
